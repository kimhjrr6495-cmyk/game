function updCreatures(dt){const cs=run.creatures,n=cs.length,m=44;let normal=0,inf=0,ang=0;const sl=tl('spore'),sporeD=T.spore[Math.max(0,sl-1)];

        break;}

/* ============ 9. 피해 / 사망 / 범위 피해 큐 ============ */
function damage(c,amt,src,e){

  if(c.shield){if(e&&e.click)ring(c.x,c.y,c.r+2,c.r+9,0.18,'#ffffff',1,{a:0.6});return false;}
  if(c.ghost)return false;

  if(c.isLure){tgt=run.boss;if(!tgt)return false;amt*=CONFIG.BOSS.weak;weak=true;}
  if(tgt.isBoss&&(!tgt.active||tgt.dead))return false;
  if(src==='spark'&&run.syn.snipe&&(tgt.isBoss||tgt.sp===1||tgt.sp===2))amt*=T.snipeMul;
  if(src==='firefly'&&run.syn.carrier&&c.inf>0)amt*=T.carrierMul;
  if(run.relics.eye&&(tgt.isBoss||tgt.sp===1||tgt.sp===2))amt*=CONFIG.RELIC.eyeMul;

  const real=Math.min(amt,tgt.hp);tgt.hp-=amt;tgt.flash=0.06;tgt.pop=0.12;logDmg(src,real);
  if(e&&e.x!==undefined&&!tgt.isBoss&&!c.sp){const dx=c.x-e.x,dy=c.y-e.y,l=Math.hypot(dx,dy)||1;c.ix+=dx/l*CONFIG.PULSE.knock;c.iy+=dy/l*CONFIG.PULSE.knock;}

}

function beamHit(b){const K=CONFIG.SKILL.prism,D=skillDmg(K.dmg)*b.mul,ca=Math.cos(b.a),sa=Math.sin(b.a),hw=K.width/2,cs=run.creatures,n=cs.length,cr2=K.crossR*K.crossR;

function updBoss(dt){const b=run.boss;if(!b)return;const B=CONFIG.BOSS;b.t+=dt;if(b.flash>0)b.flash-=dt;if(b.pop>0)b.pop-=dt;

function rollLevel(techOnly){const L=CONFIG.LEVEL,C=CONFIG.CURSE;
  const techs=shuffle(TECHS.filter(d=>tl(d.id)<d.max&&run.level>=(d.minLv||0))),stats=shuffle(STATS.filter(d=>run.stats[d.id]<d.max)),out=[];

function glow(col){let s=GL[col];if(s)return s;s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d'),c=hexRgb(col),p='rgba('+c[0]+','+c[1]+','+c[2]+',',gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,p+'0.95)');gr.addColorStop(0.22,p+'0.4)');gr.addColorStop(0.55,p+'0.1)');gr.addColorStop(1,p+'0)');g.fillStyle=gr;g.fillRect(0,0,64,64);GL[col]=s;return s;}
function dg(col,x,y,r,a){if(!(a>0.004)||!(r>0))return;ctx.globalAlpha=a>1?1:a;ctx.drawImage(glow(col),x-r,y-r,r*2,r*2);}

    for(let i=0;i<4;i++){const x0=W*(0.16+i*0.25)+Math.sin(run.clock*0.2+i*1.7)*24,w=60+i*14,sl=H*0.32;c.beginPath();c.moveTo(x0,0);c.lineTo(x0+w,0);c.lineTo(x0+w*1.6-sl,H*0.9);c.lineTo(x0-sl-w*0.4,H*0.9);c.closePath();c.fill();}}
  c.globalCompositeOperation='source-over';
  const s=run.sil;if(s.on){const sp=glow(DARK);c.globalAlpha=0.55;c.drawImage(sp,s.x-340*s.sc,s.y-95*s.sc,680*s.sc,190*s.sc);c.drawImage(sp,s.x-s.dir*(330*s.sc)-90*s.sc,s.y-120*s.sc,180*s.sc,240*s.sc);c.drawImage(sp,s.x+s.dir*60*s.sc-70*s.sc,s.y-150*s.sc,140*s.sc,160*s.sc);}

function drawSnow(layer){const c=ctx,pts=S.snow[layer],px=(S.mx-W/2)*(layer?-0.035:-0.012),py=(S.my-H/2)*(layer?-0.035:-0.012);c.globalCompositeOperation='source-over';c.globalAlpha=layer?0.4:0.2;c.fillStyle='#cfe4ff';

    c.globalAlpha=0.2;c.lineWidth=B.waveW*2;for(let q=0;q<2;q++){c.beginPath();c.arc(w.x,w.y,w.r,w.ga+q*Math.PI+g,w.ga+q*Math.PI+Math.PI-g);c.stroke();}}
  const bt=run.bites;c.globalCompositeOperation='source-over';
  for(let i=0;i<bt.length;i++){const q=bt[i],R=q.r,p=clamp(q.t/B.biteT,0,1);
    if(!q.snap){c.globalAlpha=0.16;c.fillStyle=COL.coral;c.beginPath();c.arc(q.x,q.y,R*eOC(p),0,TAU);c.fill();c.globalAlpha=0.9;c.strokeStyle=COL.coral;c.lineWidth=2;c.beginPath();c.arc(q.x,q.y,R,0,TAU);c.stroke();}
    else{const sp=clamp((q.t-B.biteT)/B.biteSnap,0,1),fd=1-clamp((q.t-B.biteT-B.biteSnap)/0.15,0,1);c.globalAlpha=0.85*fd;c.strokeStyle=COL.coral;c.lineWidth=3;c.beginPath();c.arc(q.x,q.y,R*(1-eOC(sp))+2,0,TAU);c.stroke();c.lineWidth=1;c.beginPath();
      for(let k=0;k<14;k++){const an=k*TAU/14+sp*0.8;c.moveTo(q.x+Math.cos(an)*R,q.y+Math.sin(an)*R);c.lineTo(q.x+Math.cos(an+0.6)*R*(1-sp),q.y+Math.sin(an+0.6)*R*(1-sp));}c.stroke();
      c.globalAlpha=0.7*fd;c.strokeStyle=COL.coral;c.lineWidth=2;c.beginPath();c.arc(q.x,q.y,R,0,TAU);c.stroke();}}

  for(let l=0;l<2;l++){const pts=S.snow[l];for(let i=0;i<pts.length;i++){const p=pts[i];p.y-=p.v*dt/Math.max(1,H);if(p.y<0){p.y+=1;p.x=Math.random();}}}
  const s=run.sil;if(s.on){s.x+=s.dir*22*dt;if(s.x<-520||s.x>W+520){s.on=false;s.t=rnd(20,40);}}else{s.t-=dt;if(s.t<=0){s.on=true;s.dir=Math.random()<0.5?1:-1;s.x=s.dir>0?-460:W+460;s.y=rnd(H*0.2,H*0.8);s.sc=rnd(0.8,1.4);}}
}
function update(dt){run.clock+=dt;const live=!run.title&&!run.ended&&run.dying<0;if(live)run.time+=dt;run.moteFrame=0;run.zoneT+=dt;
  const sec=Math.floor(run.clock);if(sec!==run.dmgSec){run.dmgSec=sec;run.dmgLog[sec%30]={};if(!run.title&&!run.ended)checkAch();}
  gridBuild();
  if(!run.title)timeline(dt);
  spawnFill();
  run.pulseT-=dt;
  if(run.dying<0){if(S.click){S.click=false;if(run.clock-run.lastPulse>=CONFIG.PULSE.minGap){firePulse(S.mx,S.my);run.pulseT=pulseInt();}}
    else if(S.down&&run.pulseT<=0){firePulse(S.mx,S.my);run.pulseT=pulseInt();}}
  runSched();
  if(!run.title){updSkills(dt);updTechs(dt);}
  updCreatures(dt);updBoss(dt);updBites(dt);updWaves(dt);procAoe();updMotes(dt);updFx(dt);
  if(run.noteT>0){run.noteT-=dt;if(run.noteT<=0)run.noteIdx=0;}
  for(const k in run.buffs)if(run.buffs[k]>0)run.buffs[k]-=dt;
  compact(run.creatures);compact(run.parts);compact(run.rings);compact(run.motes);compact(run.nums);compact(run.sparks);compact(run.bolts);compact(run.rays);
  compact(run.beams);compact(run.suns);compact(run.vortex);compact(run.zones);compact(run.flares);compact(run.charges);compact(run.bites);compact(run.waves);
  if(!Number.isFinite(run.lumens))run.lumens=0;if(!Number.isFinite(run.lantern))run.lantern=run.lanternMax;
  audioLow(live&&run.lantern/run.lanternMax<=CONFIG.LANTERN.low);
}
function step(rdt){let dt=rdt;
  if(run.hitstop>0){run.hitstop-=rdt;dt=0;}
  else{
    if(run.ending>=0){run.ending+=rdt;endingTick();if(S.state!=='PLAYING')return;if(run.ending<CONFIG.BOSS.slow)dt*=CONFIG.BOSS.slowScale;}
    if(run.cardDelay>=0){run.cardDelay-=rdt;dt*=clamp(run.cardDelay/CONFIG.LEVEL.slow,0.1,1);
      if(run.cardDelay<=0){run.cardDelay=-1;if(run.cardQ.length&&!run.ended&&run.dying<0){openCard(run.cardQ.shift());return;}run.cardQ.length=0;}}
    if(run.dying>=0){run.dying-=rdt;if(run.dying<=0){showResult(false);return;}}
  }
  run.trauma=Math.max(0,run.trauma-CONFIG.SHAKE.decay*rdt);run.flash=Math.max(0,run.flash-rdt*1.6);run.pulseAnim=Math.max(0,run.pulseAnim-rdt*8);run.absorbPulse=Math.max(0,run.absorbPulse-rdt*6);
  run.lumFlash-=rdt;run.hurtFx=Math.max(0,run.hurtFx-rdt*1.5);run.vign=Math.max(0,run.vign-rdt*0.9);
  if(run.lanternLag>run.lantern)run.lanternLag=Math.max(run.lantern,run.lanternLag-run.lanternMax*0.25*rdt);else run.lanternLag=run.lantern;
  run.trail.push(S.mx,S.my);if(run.trail.length>24)run.trail.splice(0,2);
  if(dt>0)update(dt);
}
function fatal(e){if(S.fatal)return;S.fatal=true;const el=$('err');el.textContent='오류가 발생했습니다 — 새로고침(F5)해 주세요.\n\n'+(e&&e.message?e.message:String(e))+'\n\n'+(e&&e.stack?e.stack:'');el.classList.remove('hide');document.body.classList.remove('play');}
window.onerror=function(msg,src,line,col,err){fatal(err||new Error(msg+' @'+line+':'+col));};
function frame(now){if(S.fatal)return;requestAnimationFrame(frame);
  try{let rdt=(now-S.last)/1000;S.last=now;if(!(rdt>0))rdt=0;
    if(rdt<0.5){S.fpsT+=rdt;S.fpsN++;if(S.fpsT>=2){if(S.fpsN/S.fpsT<CONFIG.FPS_LOW&&S.state==='PLAYING')S.pmul=Math.max(CONFIG.PMUL_MIN,S.pmul*CONFIG.PMUL_STEP);S.fpsT=0;S.fpsN=0;}}
    rdt=Math.min(rdt,CONFIG.DT_MAX);S.rt+=rdt;
    if(S.state==='PLAYING'||S.state==='TITLE')step(rdt);
    render();hudUpdate(rdt);uiTick();toastTick();
  }catch(e){fatal(e);}
}

/* ============ 20. 입력 / 초기화 ============ */
function resize(){const ow=W,oh=H;W=Math.max(320,window.innerWidth);H=Math.max(240,window.innerHeight);
  if(run&&ow>0&&oh>0&&(ow!==W||oh!==H)){const kx=W/ow,ky=H/oh,cs=run.creatures;for(let i=0;i<cs.length;i++){cs[i].x*=kx;cs[i].y*=ky;}for(let i=0;i<run.schools.length;i++){run.schools[i].x*=kx;run.schools[i].y*=ky;}}DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);}
function init(){cv=$('cv');ctx=cv.getContext('2d');resize();S.mx=W/2;S.my=H*0.62;
  for(let i=0;i<80;i++)S.snow[0].push({x:Math.random(),y:Math.random(),s:rnd(1,1.6),v:rnd(8,16)});
  for(let i=0;i<36;i++)S.snow[1].push({x:Math.random(),y:Math.random(),s:rnd(1.6,2.8),v:rnd(22,40)});
  resetRun(true);titleBest();setState('TITLE');
  window.addEventListener('resize',resize);
  window.addEventListener('pointermove',e=>{S.mx=e.clientX;S.my=e.clientY;});
  window.addEventListener('pointerdown',e=>{S.mx=e.clientX;S.my=e.clientY;audioInit();if(e.button!==0)return;if(e.target&&e.target.closest&&e.target.closest('.ui'))return;if(S.state==='PLAYING'||S.state==='TITLE'){S.down=true;S.click=true;}});
  window.addEventListener('pointerup',()=>{S.down=false;});window.addEventListener('pointercancel',()=>{S.down=false;});
  window.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('blur',()=>{S.down=false;if(S.state==='PLAYING')openPause();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){S.down=false;if(S.state==='PLAYING')openPause();}});
  window.addEventListener('keydown',e=>{const k=e.code;if(e.repeat)return;audioInit();
    if(k==='KeyM'){meta.mute=!meta.mute;saveMeta();audioMute();if(S.state==='PAUSE')renderPause();return;}
    if(k==='Escape'){if(S.state==='PLAYING')openPause();else if(S.state==='PAUSE')setState('PLAYING');return;}
    if(S.state==='PLAYING'){if(k==='KeyQ')castSkill('Q');else if(k==='KeyE')castSkill('E');else if(k==='KeyT')castFusion();}
    else if(S.state==='CARD'||S.state==='SKILL_PICK'){if(k==='Digit1'||k==='Numpad1')chooseCard(0);else if(k==='Digit2'||k==='Numpad2')chooseCard(1);else if(k==='Digit3'||k==='Numpad3')chooseCard(2);else if(k==='KeyR')rerollCards();}
  });
  $('btnDive').addEventListener('click',startDive);$('btnShop').addEventListener('click',()=>{audioInit();sfx('select');openShop('TITLE');});
  document.addEventListener('click',e=>{const t=e.target&&e.target.closest?e.target.closest('[data-a]'):null;if(!t)return;const a=t.dataset.a;sfx('select');
    if(a==='resume'){if(S.state==='PAUSE')setState('PLAYING');}
    else if(a==='title')toTitle();
    else if(a==='dive')startDive();
    else if(a==='shop')openShop(S.state);
    else if(a==='endless')continueEndless();
    else if(a==='codex'){audioInit();openCodex();}
    else if(a==='mute'){meta.mute=!meta.mute;saveMeta();audioMute();renderPause();}
    else if(a.indexOf('shake:')===0){meta.shake=+a.slice(6);saveMeta();renderPause();}
    else if(a.indexOf('buy:')===0)buy(a.slice(4));});
  S.last=performance.now();requestAnimationFrame(frame);
}
try{init();}catch(e){fatal(e);}
</script>
